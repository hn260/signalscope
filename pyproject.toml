[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalscope"
version = "1.0.0"
description = "Automated Model for Analysis of .IQ and .wav Files Along with Signal Parameter Extraction (SIH26147)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "plotly>=5.14.0",
    "streamlit>=1.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
